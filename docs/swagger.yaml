basePath: /api
definitions:
  common.JSONResponse:
    properties:
      isSuccess:
        type: boolean
      items: {}
      message:
        type: string
    type: object
  entities.User:
    properties:
      createdAt:
        type: string
      credentials:
        $ref: '#/definitions/jsonb.JSONB-array_webauthn_Credential'
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      id:
        type: integer
      password:
        type: string
      updatedAt:
        type: string
      username:
        type: string
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  handlers.OAuth2ErrorResponse:
    properties:
      error:
        example: invalid_grant
        type: string
      error_description:
        example: The provided authorization grant or refresh token is invalid
        type: string
    type: object
  handlers.TokenResponse:
    properties:
      access_token:
        example: 2YotnFZFEjr1zCsicMWpAA
        type: string
      expires_in:
        example: 3600
        type: integer
      refresh_token:
        example: tGzv3JOkF0XG5Qx2TlKWIA
        type: string
      scope:
        example: read
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  jsonb.JSONB-array_webauthn_Credential:
    properties:
      datatypes.JSON:
        items:
          format: int32
          type: integer
        type: array
    type: object
  models.BeginLoginWebAuthn:
    properties:
      options:
        $ref: '#/definitions/protocol.CredentialAssertion'
      sessionId:
        type: string
    type: object
  models.BeginRegisterWebAuthn:
    properties:
      options:
        $ref: '#/definitions/protocol.CredentialCreation'
      sessionId:
        type: string
    type: object
  models.LoginResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/entities.User'
    type: object
  models.UserInput:
    properties:
      credentials:
        $ref: '#/definitions/jsonb.JSONB-array_webauthn_Credential'
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  protocol.AttestationFormat:
    enum:
    - packed
    - tpm
    - android-key
    - android-safetynet
    - fido-u2f
    - apple
    - compound
    - none
    type: string
    x-enum-varnames:
    - AttestationFormatPacked
    - AttestationFormatTPM
    - AttestationFormatAndroidKey
    - AttestationFormatAndroidSafetyNet
    - AttestationFormatFIDOUniversalSecondFactor
    - AttestationFormatApple
    - AttestationFormatCompound
    - AttestationFormatNone
  protocol.AuthenticationExtensions:
    additionalProperties: {}
    type: object
  protocol.AuthenticationExtensionsClientOutputs:
    additionalProperties: {}
    type: object
  protocol.AuthenticatorAssertionResponse:
    properties:
      authenticatorData:
        items:
          type: integer
        type: array
      clientDataJSON:
        description: |-
          From the spec https://www.w3.org/TR/webauthn/#dom-authenticatorresponse-clientdatajson
          This attribute contains a JSON serialization of the client data passed to the authenticator
          by the client in its call to either create() or get().
        items:
          type: integer
        type: array
      signature:
        items:
          type: integer
        type: array
      userHandle:
        items:
          type: integer
        type: array
    type: object
  protocol.AuthenticatorAttachment:
    enum:
    - platform
    - cross-platform
    type: string
    x-enum-varnames:
    - Platform
    - CrossPlatform
  protocol.AuthenticatorAttestationResponse:
    properties:
      attestationObject:
        description: |-
          AttestationObject is the byte slice version of attestationObject.
          This attribute contains an attestation object, which is opaque to, and
          cryptographically protected against tampering by, the client. The
          attestation object contains both authenticator data and an attestation
          statement. The former contains the AAGUID, a unique credential ID, and
          the credential public key. The contents of the attestation statement are
          determined by the attestation statement format used by the authenticator.
          It also contains any additional information that the Relying Party's server
          requires to validate the attestation statement, as well as to decode and
          validate the authenticator data along with the JSON-serialized client data.
        items:
          type: integer
        type: array
      authenticatorData:
        items:
          type: integer
        type: array
      clientDataJSON:
        description: |-
          From the spec https://www.w3.org/TR/webauthn/#dom-authenticatorresponse-clientdatajson
          This attribute contains a JSON serialization of the client data passed to the authenticator
          by the client in its call to either create() or get().
        items:
          type: integer
        type: array
      publicKey:
        items:
          type: integer
        type: array
      publicKeyAlgorithm:
        type: integer
      transports:
        items:
          type: string
        type: array
    type: object
  protocol.AuthenticatorSelection:
    properties:
      authenticatorAttachment:
        allOf:
        - $ref: '#/definitions/protocol.AuthenticatorAttachment'
        description: |-
          AuthenticatorAttachment If this member is present, eligible authenticators are filtered to only
          authenticators attached with the specified AuthenticatorAttachment enum.
      requireResidentKey:
        description: |-
          RequireResidentKey this member describes the Relying Party's requirements regarding resident
          credentials. If the parameter is set to true, the authenticator MUST create a client-side-resident
          public key credential source when creating a public key credential.
        type: boolean
      residentKey:
        allOf:
        - $ref: '#/definitions/protocol.ResidentKeyRequirement'
        description: |-
          ResidentKey this member describes the Relying Party's requirements regarding resident
          credentials per Webauthn Level 2.
      userVerification:
        allOf:
        - $ref: '#/definitions/protocol.UserVerificationRequirement'
        description: |-
          UserVerification This member describes the Relying Party's requirements regarding user verification for
          the create() operation. Eligible authenticators are filtered to only those capable of satisfying this
          requirement.
    type: object
  protocol.AuthenticatorTransport:
    enum:
    - usb
    - nfc
    - ble
    - smart-card
    - hybrid
    - internal
    type: string
    x-enum-varnames:
    - USB
    - NFC
    - BLE
    - SmartCard
    - Hybrid
    - Internal
  protocol.ConveyancePreference:
    enum:
    - none
    - indirect
    - direct
    - enterprise
    type: string
    x-enum-varnames:
    - PreferNoAttestation
    - PreferIndirectAttestation
    - PreferDirectAttestation
    - PreferEnterpriseAttestation
  protocol.CredentialAssertion:
    properties:
      mediation:
        $ref: '#/definitions/protocol.CredentialMediationRequirement'
      publicKey:
        $ref: '#/definitions/protocol.PublicKeyCredentialRequestOptions'
    type: object
  protocol.CredentialAssertionResponse:
    properties:
      authenticatorAttachment:
        type: string
      clientExtensionResults:
        $ref: '#/definitions/protocol.AuthenticationExtensionsClientOutputs'
      id:
        description: |-
          ID is The credential’s identifier. The requirements for the
          identifier are distinct for each type of credential. It might
          represent a username for username/password tuples, for example.
        type: string
      rawId:
        items:
          type: integer
        type: array
      response:
        $ref: '#/definitions/protocol.AuthenticatorAssertionResponse'
      type:
        description: |-
          Type is the value of the object’s interface object's [[type]] slot,
          which specifies the credential type represented by this object.
          This should be type "public-key" for Webauthn credentials.
        type: string
    type: object
  protocol.CredentialCreation:
    properties:
      mediation:
        $ref: '#/definitions/protocol.CredentialMediationRequirement'
      publicKey:
        $ref: '#/definitions/protocol.PublicKeyCredentialCreationOptions'
    type: object
  protocol.CredentialCreationResponse:
    properties:
      authenticatorAttachment:
        type: string
      clientExtensionResults:
        $ref: '#/definitions/protocol.AuthenticationExtensionsClientOutputs'
      id:
        description: |-
          ID is The credential’s identifier. The requirements for the
          identifier are distinct for each type of credential. It might
          represent a username for username/password tuples, for example.
        type: string
      rawId:
        items:
          type: integer
        type: array
      response:
        $ref: '#/definitions/protocol.AuthenticatorAttestationResponse'
      type:
        description: |-
          Type is the value of the object’s interface object's [[type]] slot,
          which specifies the credential type represented by this object.
          This should be type "public-key" for Webauthn credentials.
        type: string
    type: object
  protocol.CredentialDescriptor:
    properties:
      id:
        description: CredentialID The ID of a credential to allow/disallow.
        items:
          type: integer
        type: array
      transports:
        description: The authenticator transports that can be used.
        items:
          $ref: '#/definitions/protocol.AuthenticatorTransport'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/protocol.CredentialType'
        description: The valid credential types.
    type: object
  protocol.CredentialMediationRequirement:
    enum:
    - ""
    - silent
    - optional
    - conditional
    - required
    type: string
    x-enum-varnames:
    - MediationDefault
    - MediationSilent
    - MediationOptional
    - MediationConditional
    - MediationRequired
  protocol.CredentialParameter:
    properties:
      alg:
        $ref: '#/definitions/webauthncose.COSEAlgorithmIdentifier'
      type:
        $ref: '#/definitions/protocol.CredentialType'
    type: object
  protocol.CredentialType:
    enum:
    - public-key
    type: string
    x-enum-varnames:
    - PublicKeyCredentialType
  protocol.PublicKeyCredentialCreationOptions:
    properties:
      attestation:
        $ref: '#/definitions/protocol.ConveyancePreference'
      attestationFormats:
        items:
          $ref: '#/definitions/protocol.AttestationFormat'
        type: array
      authenticatorSelection:
        $ref: '#/definitions/protocol.AuthenticatorSelection'
      challenge:
        items:
          type: integer
        type: array
      excludeCredentials:
        items:
          $ref: '#/definitions/protocol.CredentialDescriptor'
        type: array
      extensions:
        $ref: '#/definitions/protocol.AuthenticationExtensions'
      hints:
        items:
          $ref: '#/definitions/protocol.PublicKeyCredentialHints'
        type: array
      pubKeyCredParams:
        items:
          $ref: '#/definitions/protocol.CredentialParameter'
        type: array
      rp:
        $ref: '#/definitions/protocol.RelyingPartyEntity'
      timeout:
        type: integer
      user:
        $ref: '#/definitions/protocol.UserEntity'
    type: object
  protocol.PublicKeyCredentialHints:
    enum:
    - security-key
    - client-device
    - hybrid
    type: string
    x-enum-varnames:
    - PublicKeyCredentialHintSecurityKey
    - PublicKeyCredentialHintClientDevice
    - PublicKeyCredentialHintHybrid
  protocol.PublicKeyCredentialRequestOptions:
    properties:
      allowCredentials:
        items:
          $ref: '#/definitions/protocol.CredentialDescriptor'
        type: array
      challenge:
        items:
          type: integer
        type: array
      extensions:
        $ref: '#/definitions/protocol.AuthenticationExtensions'
      hints:
        items:
          $ref: '#/definitions/protocol.PublicKeyCredentialHints'
        type: array
      rpId:
        type: string
      timeout:
        type: integer
      userVerification:
        $ref: '#/definitions/protocol.UserVerificationRequirement'
    type: object
  protocol.RelyingPartyEntity:
    properties:
      id:
        description: A unique identifier for the Relying Party entity, which sets
          the RP ID.
        type: string
      name:
        description: |-
          A human-palatable name for the entity. Its function depends on what the PublicKeyCredentialEntity represents:

          When inherited by PublicKeyCredentialRpEntity it is a human-palatable identifier for the Relying Party,
          intended only for display. For example, "ACME Corporation", "Wonderful Widgets, Inc." or "ОАО Примертех".

          When inherited by PublicKeyCredentialUserEntity, it is a human-palatable identifier for a user account. It is
          intended only for display, i.e., aiding the user in determining the difference between user accounts with similar
          displayNames. For example, "alexm", "alex.p.mueller@example.com" or "+14255551234".
        type: string
    type: object
  protocol.ResidentKeyRequirement:
    enum:
    - discouraged
    - preferred
    - required
    type: string
    x-enum-varnames:
    - ResidentKeyRequirementDiscouraged
    - ResidentKeyRequirementPreferred
    - ResidentKeyRequirementRequired
  protocol.UserEntity:
    properties:
      displayName:
        description: |-
          A human-palatable name for the user account, intended only for display.
          For example, "Alex P. Müller" or "田中 倫". The Relying Party SHOULD let
          the user choose this, and SHOULD NOT restrict the choice more than necessary.
        type: string
      id:
        description: |-
          ID is the user handle of the user account entity. To ensure secure operation,
          authentication and authorization decisions MUST be made on the basis of this id
          member, not the displayName nor name members. See Section 6.1 of
          [RFC8266](https://www.w3.org/TR/webauthn/#biblio-rfc8266).
      name:
        description: |-
          A human-palatable name for the entity. Its function depends on what the PublicKeyCredentialEntity represents:

          When inherited by PublicKeyCredentialRpEntity it is a human-palatable identifier for the Relying Party,
          intended only for display. For example, "ACME Corporation", "Wonderful Widgets, Inc." or "ОАО Примертех".

          When inherited by PublicKeyCredentialUserEntity, it is a human-palatable identifier for a user account. It is
          intended only for display, i.e., aiding the user in determining the difference between user accounts with similar
          displayNames. For example, "alexm", "alex.p.mueller@example.com" or "+14255551234".
        type: string
    type: object
  protocol.UserVerificationRequirement:
    enum:
    - required
    - preferred
    - discouraged
    type: string
    x-enum-comments:
      VerificationPreferred: This is the default.
    x-enum-descriptions:
    - ""
    - This is the default.
    - ""
    x-enum-varnames:
    - VerificationRequired
    - VerificationPreferred
    - VerificationDiscouraged
  webauthncose.COSEAlgorithmIdentifier:
    enum:
    - -7
    - -8
    - -9
    - -19
    - -35
    - -36
    - -37
    - -38
    - -39
    - -47
    - -48
    - -49
    - -50
    - -51
    - -52
    - -257
    - -258
    - -259
    - -65535
    type: integer
    x-enum-varnames:
    - AlgES256
    - AlgEdDSA
    - AlgESP256
    - AlgEd25519
    - AlgES384
    - AlgES512
    - AlgPS256
    - AlgPS384
    - AlgPS512
    - AlgES256K
    - AlgMLDSA44
    - AlgMLDSA65
    - AlgMLDSA87
    - AlgESP384
    - AlgESP512
    - AlgRS256
    - AlgRS384
    - AlgRS512
    - AlgRS1
info:
  contact:
    email: fiber@swagger.io
    name: API Support
  description: This is a sample swagger for Fiber
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Fiber Example API
  version: "1.0"
paths:
  /v1/auth/login/begin:
    post:
      consumes:
      - application/json
      description: Initiates WebAuthn login by retrieving credential assertion options.
      parameters:
      - description: Username
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Login started successfully
          schema:
            allOf:
            - $ref: '#/definitions/common.JSONResponse'
            - properties:
                items:
                  $ref: '#/definitions/models.BeginLoginWebAuthn'
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.JSONResponse'
      summary: Begin WebAuthn Login
      tags:
      - Auth
  /v1/auth/login/finish:
    post:
      consumes:
      - application/json
      description: Validates the credential assertion response and returns access
        and refresh tokens.
      parameters:
      - description: Session ID
        in: query
        name: session_id
        required: true
        type: string
      - description: Username
        in: query
        name: username
        required: true
        type: string
      - description: Credential Assertion Response
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/protocol.CredentialAssertionResponse'
      produces:
      - application/json
      responses:
        "200":
          description: Login finished successfully
          schema:
            allOf:
            - $ref: '#/definitions/common.JSONResponse'
            - properties:
                items:
                  $ref: '#/definitions/models.LoginResponse'
              type: object
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/common.JSONResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.JSONResponse'
      summary: Finish WebAuthn Login
      tags:
      - Auth
  /v1/auth/register/begin:
    post:
      consumes:
      - application/json
      description: Initiates WebAuthn registration by checking username availability
        and returning credential creation options.
      parameters:
      - description: User Registration Input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.UserInput'
      produces:
      - application/json
      responses:
        "200":
          description: Registration started successfully
          schema:
            allOf:
            - $ref: '#/definitions/common.JSONResponse'
            - properties:
                items:
                  $ref: '#/definitions/models.BeginRegisterWebAuthn'
              type: object
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/common.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.JSONResponse'
      summary: Begin WebAuthn Registration
      tags:
      - Auth
  /v1/auth/register/finish:
    post:
      consumes:
      - application/json
      description: Validates the credential creation response and saves the credential
        to database.
      parameters:
      - description: Session ID
        in: query
        name: session_id
        required: true
        type: string
      - description: Username
        in: query
        name: username
        required: true
        type: string
      - description: Credential Creation Response
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/protocol.CredentialCreationResponse'
      produces:
      - application/json
      responses:
        "200":
          description: Registration finished
          schema:
            $ref: '#/definitions/common.JSONResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/common.JSONResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.JSONResponse'
      summary: Finish WebAuthn Registration
      tags:
      - Auth
  /v1/oauth/authorize:
    get:
      consumes:
      - application/x-www-form-urlencoded
      description: Handles the authorization request, redirects the user to login
        or consent page.
      parameters:
      - description: Response type, must be 'code'
        in: query
        name: response_type
        required: true
        type: string
      - description: Client ID
        in: query
        name: client_id
        required: true
        type: string
      - description: Redirect URI
        in: query
        name: redirect_uri
        required: true
        type: string
      - description: Requested scope
        in: query
        name: scope
        type: string
      - description: State parameter to prevent CSRF
        in: query
        name: state
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirects to redirect_uri
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.OAuth2ErrorResponse'
      summary: OAuth2 Authorization Endpoint
      tags:
      - OAuth
  /v1/oauth/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Exchanges authorization code, refresh token, client credentials,
        or password for an access token.
      parameters:
      - description: Grant type (e.g., authorization_code, client_credentials, password,
          refresh_token)
        in: formData
        name: grant_type
        required: true
        type: string
      - description: Client ID
        in: formData
        name: client_id
        type: string
      - description: Client Secret
        in: formData
        name: client_secret
        type: string
      - description: Authorization code (required for authorization_code)
        in: formData
        name: code
        type: string
      - description: Redirect URI (required for authorization_code)
        in: formData
        name: redirect_uri
        type: string
      - description: Requested scope
        in: formData
        name: scope
        type: string
      - description: Refresh token (required for refresh_token)
        in: formData
        name: refresh_token
        type: string
      - description: Username (required for password)
        in: formData
        name: username
        type: string
      - description: Password (required for password)
        in: formData
        name: password
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Token response
          schema:
            $ref: '#/definitions/handlers.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.OAuth2ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.OAuth2ErrorResponse'
      summary: OAuth2 Token Endpoint
      tags:
      - OAuth
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
